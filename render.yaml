# Despliegue en Render (Blueprint). Sube el repo a GitHub → Render → New → Blueprint.
# Luego define en el dashboard las variables marcadas sync:false (secretas).
services:
  - type: web
    name: cm-agent            # cámbialo por el nombre de tu cliente
    runtime: node
    plan: free                # "starter" (~$7/mes) para que no se duerma
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ACCESS_PASSWORD
        sync: false
      - key: BRAND_NAME
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: DRIVE_FOLDER_ID
        sync: false
      - key: PARRILLA_TEMPLATE_ID
        sync: false
      - key: MODEL
        value: claude-sonnet-4-6
